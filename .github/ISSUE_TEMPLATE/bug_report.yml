name: Bug report
description: Something that should work and does not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Error text goes here as written.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` in `manifest.json`, or the commit you are on.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: GPU and VRAM, RAM, and the backend (cu130, rocm, xpu, mps or cpu).
      placeholder: RTX 4070 Ti 12 GB, 32 GB RAM, cu130
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Fedora 43, driver 590.xx
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and tier
      description: As shown on the Models page, if the bug involves a job or a chat.
      placeholder: Z-Image Turbo, gguf_q4
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of `logs/run_and_install.log` from the data directory, and the error from `logs/engine.log` if there is one. Neither file contains prompts.
      render: text
