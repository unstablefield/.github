name: Model request
description: A model for the catalogue.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The default catalogue takes Apache-2.0, ungated models only. Other licenses, gated downloads, region limits and community-modified weights go in the Extended list, hidden by default, with the license shown before an install. A model with no license is not listed anywhere, and quantising a model does not change its license.
  - type: input
    id: repo
    attributes:
      label: Hugging Face repository
      placeholder: Tongyi-MAI/Z-Image-Turbo
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      description: The license name and a link to it. Say if the repository is gated, region-limited, or a community modification of another model.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it does that the catalogue cannot, and the smallest hardware you think it fits.
    validations:
      required: true
  - type: input
    id: weights
    attributes:
      label: Pre-quantized weights
      description: Links to GGUF, fp8 or NF4 files if any exist. The engine ships pre-quantized files and never quantizes at generation time.
