name: Feature request
description: Something the app should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the wiki's roadmap first. It lists what is being worked on, what comes after, and what is not scheduled with the reason. The planner decides steps, guidance, schedulers, dtypes and offload; requests to expose those as settings are declined, and the roadmap says why.
  - type: textarea
    id: what
    attributes:
      label: What
      description: What you want to do and cannot.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it would look
      description: Where it goes in the UI or the API, and what the user sees. Optional.
